<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>宛諭的訓練追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:#f2f0ea; --surface:#fff; --surface2:#f7f5f0;
  --border:#e8e5de; --border2:#d8d4cb;
  --text:#1a1816; --text2:#6b6660; --text3:#aaa69e;
  --green:#3b6d11; --green-bg:#eaf3de;
  --red:#a32d2d; --red-bg:#fcebeb;
  --blue:#185fa5; --blue-bg:#e6f1fb;
  --amber:#854f0b; --amber-bg:#faeeda;
  --radius:14px; --radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overscroll-behavior:none;}

/* Login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.login-mark{width:56px;height:56px;border-radius:16px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:1.5rem;font-family:'DM Mono',monospace;}
.login-title{font-size:19px;font-weight:500;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:2rem;}
.login-input{width:100%;max-width:300px;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;font-size:15px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);display:block;margin-bottom:10px;outline:none;transition:border-color .15s;}
.login-input:focus{border-color:var(--text);}
.login-btn{width:100%;max-width:300px;padding:11px;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;}
.login-btn:active{opacity:.75;}
.login-err{font-size:13px;color:var(--red);margin-top:8px;min-height:18px;text-align:center;max-width:300px;}

/* App shell */
#app{display:none;height:100vh;flex-direction:column;overflow:hidden;}
.topbar{background:var(--bg);padding:52px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0;}
.topbar-name{font-size:22px;font-weight:500;letter-spacing:-.4px;}
.topbar-date{font-size:12px;color:var(--text2);margin-top:2px;}
.logout-btn{font-size:12px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;padding:0 6px;}
.tab{flex:1;padding:10px 4px;font-size:13px;font-weight:500;color:var(--text3);text-align:center;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;background:none;border-left:none;border-right:none;border-top:none;font-family:'DM Sans',sans-serif;}
.tab.on{color:var(--text);border-bottom-color:var(--text);}
.screens{flex:1;overflow:hidden;position:relative;}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;padding:14px 14px 80px;-webkit-overflow-scrolling:touch;}
.screen.on{display:block;}

/* Cards & Metrics */
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.mc{background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);padding:12px 14px;}
.mc-label{font-size:11px;color:var(--text3);margin-bottom:5px;}
.mc-val{font-size:24px;font-weight:500;line-height:1;}
.mc-unit{font-size:12px;color:var(--text2);margin-left:2px;}
.mc-delta{font-size:11px;margin-top:4px;}
.up{color:var(--green);}.dn{color:var(--red);}.eq{color:var(--text3);}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.sec-title{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;}

/* Heatmap */
.week-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
.wl{font-size:9px;color:var(--text3);text-align:center;}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;} .heatmap>div{position:relative;}
.hd{height:30px;border-radius:5px;background:var(--surface2);}
.hd.l1{background:#c7e6b8;}.hd.l2{background:#7fbe4e;}.hd.l3{background:#3b6d11;}

/* PR */
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--surface2);}
.pr-row:last-child{border-bottom:none;}
.pr-name{font-size:13px;font-weight:500;}
.pr-tag{font-size:10px;color:var(--text3);margin-top:2px;}
.pr-right{text-align:right;}
.pr-weight{font-size:14px;font-weight:500;}
.pr-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;margin-top:2px;background:var(--green-bg);color:var(--green);}

/* Exercise table */
.search-wrap{position:relative;margin-bottom:10px;}
.search-input{width:100%;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px 9px 36px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);outline:none;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3);}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid var(--border2);color:var(--text2);background:var(--surface);cursor:pointer;font-family:'DM Sans',sans-serif;}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.ex-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--surface2);}
.ex-row:last-child{border-bottom:none;}
.ex-name{font-size:13px;font-weight:500;}
.ex-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.ex-right{text-align:right;}
.ex-cur{font-size:13px;font-weight:500;}
.ex-best{font-size:11px;color:var(--text3);margin-top:2px;}
.ex-best.hi{color:var(--green);}

/* Log */
.week-block{margin-bottom:16px;}
.week-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.week-range{font-size:13px;font-weight:500;}
.week-stat{font-size:11px;color:var(--text3);}
.log-item{background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);padding:10px 12px;margin-bottom:6px;}
.log-top{display:flex;justify-content:space-between;align-items:flex-start;}
.log-name{font-size:13px;font-weight:500;}
.log-date-lbl{font-size:11px;color:var(--text3);}
.log-detail{font-size:12px;color:var(--text2);margin-top:4px;}
.log-chips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.log-chip{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--text2);}
.log-chip.muscle{background:var(--green-bg);color:var(--green);}
.log-chip.pr{background:var(--amber-bg);color:var(--amber);}

/* InBody */
.ib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.ib-item{background:var(--surface2);border-radius:var(--radius-sm);padding:11px 13px;}
.ib-label{font-size:10px;color:var(--text3);margin-bottom:4px;}
.ib-val{font-size:20px;font-weight:500;line-height:1;}
.ib-unit{font-size:11px;color:var(--text2);}
.ib-delta{font-size:11px;margin-top:3px;}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;}
.pill-green{background:var(--green-bg);color:var(--green);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.chart-legends{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.chart-wrap{position:relative;height:180px;}

/* Bottom nav */
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:0 8px;padding-bottom:env(safe-area-inset-bottom);z-index:100;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;}
.nav-ico{font-size:20px;line-height:1;}
.nav-lbl{font-size:10px;color:var(--text3);font-weight:500;}
.nav-btn.on .nav-lbl{color:var(--text);}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px;}

@media(min-width:480px){
  #app{max-width:430px;margin:0 auto;}
  .bottomnav{max-width:430px;left:50%;transform:translateX(-50%);}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-mark">W</div>
  <p class="login-title">宛諭的訓練追蹤</p>
  <p class="login-sub">請輸入密碼繼續</p>
  <input class="login-input" type="password" id="pw" placeholder="密碼" autocomplete="current-password" />
  <button class="login-btn" onclick="doLogin()">進入</button>
  <p class="login-err" id="login-err"></p>
</div>

<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-name">宛諭的訓練</div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">登出</button>
  </div>

  <div class="tabs">
    <button class="tab on" id="t0" onclick="switchTab(0)">總覽</button>
    <button class="tab" id="t1" onclick="switchTab(1)">動作</button>
    <button class="tab" id="t2" onclick="switchTab(2)">日誌</button>
    <button class="tab" id="t3" onclick="switchTab(3)">InBody</button>
  </div>

  <div class="screens">
    <!-- 總覽 -->
    <div class="screen on" id="s0">
      <div class="metric-grid" id="overview-metrics">
        <div class="mc"><div class="mc-label">本月運動次數</div><div class="mc-val">—</div></div>
        <div class="mc"><div class="mc-label">最新體重</div><div class="mc-val">—</div></div>
        <div class="mc"><div class="mc-label">最新體脂率</div><div class="mc-val">—</div></div>
        <div class="mc"><div class="mc-label">近況</div><div class="mc-val" style="font-size:13px;padding-top:5px;">—</div></div>
      </div>
      <div class="card" id="cycle-card" style="border-left:3px solid #e05c5c;">
        <div class="sec-title">週期提示</div>
        <div id="cycle-tip"><div style="font-size:12px;color:var(--text3);">記錄月經後顯示建議</div></div>
      </div>
      <div class="card">
        <div class="sec-title">最近 4 週出席紀錄</div>
        <div class="week-labels">
          <div class="wl">一</div><div class="wl">二</div><div class="wl">三</div>
          <div class="wl">四</div><div class="wl">五</div><div class="wl">六</div><div class="wl">日</div>
        </div>
        <div class="heatmap" id="heatmap"></div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center;">
          <span style="font-size:10px;color:var(--text3);">少</span>
          <div style="width:14px;height:10px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);"></div>
          <div style="width:14px;height:10px;border-radius:3px;background:#c7e6b8;"></div>
          <div style="width:14px;height:10px;border-radius:3px;background:#7fbe4e;"></div>
          <div style="width:14px;height:10px;border-radius:3px;background:#3b6d11;"></div>
          <span style="font-size:10px;color:var(--text3);">多</span>
        </div>
      </div>
      <div class="card">
        <div class="sec-title">InBody 趨勢</div>
        <div class="chart-legends" style="margin-bottom:8px;">
          <div class="legend-item"><div class="legend-dot" style="background:#185fa5;"></div>體重</div>
          <div class="legend-item"><div class="legend-dot" style="background:#3b6d11;"></div>骨骼肌</div>
          <div class="legend-item"><div class="legend-dot" style="background:#993c1d;"></div>體脂率</div>
        </div>
        <div class="chart-wrap"><canvas id="overview-ib-chart"></canvas></div>
      </div>
      <div class="card">
        <div class="sec-title">近期 PR 突破</div>
        <div id="pr-list"><div class="empty">載入中...</div></div>
      </div>
    </div>

    <!-- 動作 -->
    <div class="screen" id="s1">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="ex-search" placeholder="搜尋動作名稱..." oninput="filterEx()" />
      </div>
      <div class="chips" id="muscle-chips"></div>
      <div class="card" style="padding:8px 14px;" id="ex-table">
        <div class="empty">載入中...</div>
      </div>
    </div>

    <!-- 日誌 -->
    <div class="screen" id="s2">
      <div class="chips" id="log-chips"></div>
      <div id="log-list"><div class="empty">載入中...</div></div>
    </div>

    <!-- InBody -->
    <div class="screen" id="s3">
      <div class="card" id="ib-latest">
        <div class="empty">載入中...</div>
      </div>
      <div class="card">
        <div class="sec-title">體重 · 骨骼肌 · 體脂肪量</div>
        <div class="chart-legends">
          <div class="legend-item"><div class="legend-dot" style="background:#185fa5;"></div>體重</div>
          <div class="legend-item"><div class="legend-dot" style="background:#3b6d11;"></div>骨骼肌</div>
          <div class="legend-item"><div class="legend-dot" style="background:#993c1d;"></div>體脂肪量</div>
        </div>
        <div class="chart-wrap"><canvas id="ib-chart"></canvas></div>
      </div>
      <div class="card">
        <div class="sec-title">體脂率趨勢</div>
        <div class="chart-legends">
          <div class="legend-item"><div class="legend-dot" style="background:#993c1d;"></div>體脂率 (%)</div>
        </div>
        <div class="chart-wrap"><canvas id="ib-chart2"></canvas></div>
      </div>
    </div>
  </div>

  <div class="bottomnav">
    <button class="nav-btn on" id="n0" onclick="switchTab(0)"><span class="nav-ico">◈</span><span class="nav-lbl">總覽</span></button>
    <button class="nav-btn" id="n1" onclick="switchTab(1)"><span class="nav-ico">≡</span><span class="nav-lbl">動作</span></button>
    <button class="nav-btn" id="n2" onclick="switchTab(2)"><span class="nav-ico">📅</span><span class="nav-lbl">日誌</span></button>
    <button class="nav-btn" id="n3" onclick="switchTab(3)"><span class="nav-ico">◉</span><span class="nav-lbl">InBody</span></button>
  </div>
</div>

<script>
const CFG = {
  PASSWORD: '5566',
  SHEET_ID: '1hYZervTmM7aDUJmSlE187omIAPa6zMi0JHcsPVt07Rg',
  API_KEY: 'AIzaSyCxyLWIwWBIoV3JXyeb1qWi9En8qU5x4IQ',
};

const CATS = ['全部','臀腿','肩背胸','核心','心肺','有氧'];

function classifyMuscle(raw) {
  if (!raw) return '有氧';
  if (raw.includes('心肺')) return '心肺';
  if (raw.includes('腿') || raw.includes('臀')) return '臀腿';
  if (raw.includes('背') || raw.includes('胸') || raw.includes('肩') || raw.includes('頭')) return '肩背胸';
  if (raw.includes('核心') || raw.includes('腹')) return '核心';
  return '有氧';
}

let workoutRows = [], inbodyRows = [];
let ibChart = null;
let activeMuscleFilter = '全部', activeLogFilter = '全部';
let initialized = false;

document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

function doLogin() {
  if (document.getElementById('pw').value === CFG.PASSWORD) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    if (!initialized) { initialized = true; initApp(); }
  } else {
    document.getElementById('login-err').textContent = '密碼錯誤，請再試一次';
    document.getElementById('pw').value = '';
  }
}
function doLogout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pw').value = '';
}
function switchTab(i) {
  for (let x=0;x<4;x++) {
    document.getElementById('t'+x).className='tab'+(x===i?' on':'');
    document.getElementById('s'+x).className='screen'+(x===i?' on':'');
    document.getElementById('n'+x).className='nav-btn'+(x===i?' on':'');
  }
}

const BASE = `https://sheets.googleapis.com/v4/spreadsheets/${CFG.SHEET_ID}/values`;
async function fetchRange(range) {
  try {
    const r = await fetch(`${BASE}/${encodeURIComponent(range)}?key=${CFG.API_KEY}`);
    if (!r.ok) return [];
    const d = await r.json();
    return d.values || [];
  } catch { return []; }
}

function parseWorkout(rows) {
  if (!rows.length) return [];
  const start = String(rows[0][0]).includes('-') ? 0 : 1;
  return rows.slice(start).filter(r=>r[0]&&r[1]).map(r=>({
    date:r[0]||'', exercise_name:r[1]||'', type:r[2]||'',
    muscle_groups:r[3]||'', set:r[4]||'',
    weight_kg:r[5]||'', reps:r[6]||'', duration_sec:r[7]||'',
    max_weight_kg:r[8]||'', is_pr:r[9]||'FALSE', note:r[11]||'',
  }));
}
function parseInBody(rows) {
  if (!rows.length) return [];
  const start = String(rows[0][0]).includes('-') ? 0 : 1;
  return rows.slice(start).filter(r=>r[0]).map(r=>({
    date:r[0]||'',
    weight_kg:parseFloat(r[1])||0,
    smm_kg:parseFloat(r[2])||0,
    body_fat_kg:parseFloat(r[3])||0,
    body_fat_pct:parseFloat(r[4])||0,
    ffm_kg:parseFloat(r[5])||0,
    bmi:parseFloat(r[6])||0,
    whr:parseFloat(r[7])||0,
    bmr_kcal:parseFloat(r[8])||0,
    visceral_fat:parseFloat(r[14])||0,
    fitness_score:parseFloat(r[15])||0,
  }));
}

async function initApp() {
  document.getElementById('topbar-date').textContent =
    new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long'});
  const [wRaw, iRaw, pRaw] = await Promise.all([
    fetchRange('Workout!A:M'),
    fetchRange('InBody!A:V'),
    fetchRange('Period!A:B'),
  ]);
  workoutRows = parseWorkout(wRaw);
  inbodyRows  = parseInBody(iRaw);
  // Parse period rows
  window._periodRows = (pRaw||[]).filter(r=>r[0]&&String(r[0]).includes('-')).map(r=>({date:r[0]}));
  renderOverview();
  renderExercises();
  renderLog();
  renderInBody();
}

// ── 總覽 ──
function renderOverview() {
  const now = new Date();
  const som = new Date(now.getFullYear(), now.getMonth(), 1);
  const dateSet = new Set();
  let monthCount = 0;
  workoutRows.forEach(r => {
    if (!r.date||dateSet.has(r.date)) return;
    dateSet.add(r.date);
    if (new Date(r.date)>=som) monthCount++;
  });

  const ibSorted = [...inbodyRows].sort((a,b)=>b.date.localeCompare(a.date));
  const lat = ibSorted[0], prv = ibSorted[1];

  const lastDate = dateSet.size ? [...dateSet].sort().reverse()[0] : null;
  const daysSince = lastDate ? Math.floor((now-new Date(lastDate))/86400000) : 99;
  // 計算本週訓練次數
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate()-now.getDay()+1); startOfWeek.setHours(0,0,0,0);
  const weekDays = [...dateSet].filter(d=>new Date(d)>=startOfWeek).length;
  let statusHtml, statusCls;
  if (!lastDate) {
    statusHtml='開始你的第一次訓練吧！'; statusCls='pill-amber';
  } else if (daysSince===0) {
    statusHtml='今天有訓練，繼續保持！'; statusCls='pill-green';
  } else if (daysSince===1) {
    statusHtml='昨天有訓練，今天可休息或輕度活動'; statusCls='pill-green';
  } else if (daysSince<=3) {
    statusHtml='距上次訓練 '+daysSince+' 天，是時候動了！'; statusCls='pill-amber';
  } else {
    statusHtml='已 '+daysSince+' 天未訓練，快回來！'; statusCls='pill-amber';
  }
  const statusFull='<span class="status-pill '+statusCls+'" style="font-size:11px;padding:4px 8px;">'+statusHtml+'</span>';

  function dval(cur,p,unit,inv) {
    if (!p) return '';
    const d=(parseFloat(cur)-parseFloat(p)).toFixed(1);
    const cls=inv?(parseFloat(d)<0?'up':'dn'):(parseFloat(d)>0?'up':'dn');
    return `<div class="mc-delta ${cls}">${parseFloat(d)>0?'+':''}${d}${unit}</div>`;
  }

  document.getElementById('overview-metrics').innerHTML =
    '<div class="mc"><div class="mc-label">本月運動次數</div><div class="mc-val">'+monthCount+'<span class="mc-unit">次</span></div><div class="mc-delta eq">本週 '+weekDays+' 天</div></div>'+
    '<div class="mc"><div class="mc-label">最新體重</div><div class="mc-val">'+(lat?lat.weight_kg:'--')+'<span class="mc-unit"> kg</span></div>'+(lat?dval(lat.weight_kg,prv?.weight_kg,' kg',true):'')+'</div>'+
    '<div class="mc"><div class="mc-label">最新體脂</div><div class="mc-val">'+(lat?lat.body_fat_pct:'--')+'<span class="mc-unit"> %</span></div>'+(lat?dval(lat.body_fat_pct,prv?.body_fat_pct,' %',true):'')+'</div>'+
    '<div class="mc" style="grid-column:span 2;"><div class="mc-label" style="margin-bottom:6px;">近況提示</div>'+statusFull+'</div>';

  // heatmap — align to Monday, show 4 full weeks
  const hm = document.getElementById('heatmap');
  hm.innerHTML = '';
  const trainMap = {};
  workoutRows.forEach(r=>{ if(r.date) trainMap[r.date]=(trainMap[r.date]||0)+1; });
  // Find last Sunday (end of current week display)
  const todayDay = now.getDay(); // 0=Sun,1=Mon...6=Sat
  // We want to end on the coming Sunday (or today if Sunday)
  const daysToSun = todayDay === 0 ? 0 : 7 - todayDay;
  const endDate = new Date(now); endDate.setDate(now.getDate() + daysToSun);
  // Start = 28 days before endDate
  const startDate = new Date(endDate); startDate.setDate(endDate.getDate() - 27);
  // Period map
  const periodMap = {};
  if (window._periodRows) {
    window._periodRows.forEach(r => {
      if (!r.date) return;
      const s = new Date(r.date);
      for (let i = 0; i < 5; i++) {
        const d = new Date(s); d.setDate(s.getDate() + i);
        periodMap[d.toISOString().slice(0,10)] = true;
      }
    });
  }
  for (let i = 0; i < 28; i++) {
    const d = new Date(startDate); d.setDate(startDate.getDate() + i);
    const key = d.toISOString().slice(0,10);
    const cnt = trainMap[key]||0;
    const isPeriod = periodMap[key];
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;';
    const div = document.createElement('div');
    div.className='hd '+(cnt===0?'':cnt<=2?'l1':cnt<=5?'l2':'l3');
    div.title=key+(cnt?' ('+cnt+'組)':'')+(isPeriod?' 🩸':'');
    div.style.cssText = 'position:relative;';
    wrap.appendChild(div);
    if (isPeriod) {
      const dot = document.createElement('div');
      dot.style.cssText = 'position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#e05c5c;';
      wrap.appendChild(dot);
    }
    hm.appendChild(wrap);
  }

  // PR list
  const prMap={};
  workoutRows.filter(r=>(r.is_pr||'').toUpperCase()==='TRUE').forEach(r=>{
    if(!prMap[r.exercise_name]||r.date>prMap[r.exercise_name].date) prMap[r.exercise_name]=r;
  });
  const prArr=Object.values(prMap).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  document.getElementById('pr-list').innerHTML = prArr.length
    ? prArr.map(r=>`<div class="pr-row">
        <div><div class="pr-name">${r.exercise_name}</div><div class="pr-tag">${classifyMuscle(r.muscle_groups)} · ${r.date}</div></div>
        <div class="pr-right"><div class="pr-weight">${parseFloat(r.max_weight_kg||0)>0?r.max_weight_kg+' kg':'自重'}</div><span class="pr-badge">↑ PR</span></div>
      </div>`).join('')
    : '<div class="empty">尚無 PR 紀錄</div>';

  // Cycle phase tip
  const cycleEl = document.getElementById('cycle-tip');
  if (cycleEl) {
    const periods = (window._periodRows||[]).map(r=>r.date).filter(Boolean).sort();
    if (periods.length) {
      const lastPeriod = periods[periods.length-1];
      const daysSince = Math.floor((now - new Date(lastPeriod)) / 86400000);

      // Estimate cycle length from history
      let cycleLen = 28;
      if (periods.length >= 2) {
        const diffs = [];
        for (let i=1;i<periods.length;i++) {
          const diff = Math.floor((new Date(periods[i])-new Date(periods[i-1]))/86400000);
          if (diff>18&&diff<45) diffs.push(diff);
        }
        if (diffs.length) cycleLen = Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
      }

      // Next period estimate
      const nextPeriodDate = new Date(lastPeriod);
      nextPeriodDate.setDate(nextPeriodDate.getDate() + cycleLen);
      const daysToNext = Math.floor((nextPeriodDate - now) / 86400000);

      let phase, tip, color, emoji;
      if (daysSince <= 4) {
        phase='月經期'; emoji='🩸'; color='#e05c5c';
        tip='補鐵、補水｜溫和伸展或散步｜疲倦很正常，對自己好一點 🤍';
      } else if (daysSince <= 13) {
        phase='濾泡期'; emoji='⚡'; color='#3b6d11';
        tip='蛋白質要夠｜衝力量或間歇跑｜狀態回來了，把握好好練 💪';
      } else if (daysSince <= 16) {
        phase='排卵期'; emoji='🔥'; color='#185fa5';
        tip='均衡飲食就好｜挑戰高強度或新PR｜你現在狀態最好，相信自己 🔥';
      } else if (daysSince <= 22) {
        phase='黃體期'; emoji='🌙'; color='#854f0b';
        tip='多補鎂和B群｜中低強度訓練｜情緒可能起伏，先動起來心情會好 🌙';
      } else {
        phase='黃體期後段'; emoji='⚠️'; color='#a32d2d';
        tip='⚠️ 暴食傾向期：先吃蛋白質再吃其他，避免空腹｜輕重量或瑜伽｜煩躁是荷爾蒙，不是你的錯 💛';
      }

      const nextTip = daysToNext <= 7 && daysToNext >= 0
        ? '<div style="margin-top:8px;padding:7px 10px;background:#fef0f0;border-radius:8px;font-size:11px;color:#a32d2d;">🩸 預計 '+daysToNext+' 天後月經來，準備鐵劑和暖暖包，本週選輕訓練。</div>'
        : '<div style="font-size:10px;color:var(--text3);margin-top:6px;">預計下次：'+nextPeriodDate.toLocaleDateString('zh-TW',{month:'long',day:'numeric'})+(periods.length>=2?' (週期約'+cycleLen+'天)':' (累積更多紀錄後更準確)')+'</div>';

      cycleEl.innerHTML =
        '<div style="font-size:12px;font-weight:500;color:'+color+';margin-bottom:6px;">'+emoji+' '+phase+'（第'+(daysSince+1)+'天）</div>'+
        '<div style="font-size:12px;color:var(--text2);line-height:1.6;">'+tip+'</div>'+
        nextTip;
    } else {
      cycleEl.innerHTML = '<div style="font-size:12px;color:var(--text3);">傳「月經」給 LINE Bot 開始記錄週期 🩸</div>';
    }
  }

  // overview InBody line chart
  const overviewChartEl = document.getElementById('overview-ib-chart');
  if (overviewChartEl && inbodyRows.length) {
    const cd = [...inbodyRows].sort((a,b)=>a.date.localeCompare(b.date)).slice(-6);
    if (window._overviewIbChart) window._overviewIbChart.destroy();
    window._overviewIbChart = new Chart(overviewChartEl, {
      type:'line',
      data:{
        labels: cd.map(r=>r.date.slice(5).replace('-','/')),
        datasets:[
          {data:cd.map(r=>r.weight_kg||null),borderColor:'#185fa5',backgroundColor:'rgba(24,95,165,0.07)',borderWidth:2,pointRadius:3,fill:true,tension:0.35,yAxisID:'y'},
          {data:cd.map(r=>r.smm_kg||null),borderColor:'#3b6d11',backgroundColor:'rgba(59,109,17,0.07)',borderWidth:2,pointRadius:3,fill:true,tension:0.35,yAxisID:'y'},
          {data:cd.map(r=>r.body_fat_pct||null),borderColor:'#993c1d',backgroundColor:'rgba(153,60,29,0.05)',borderWidth:2,pointRadius:3,fill:true,tension:0.35,yAxisID:'y2'},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{
          y:{position:'left',ticks:{font:{size:10},callback:v=>v+'kg'},grid:{color:'rgba(0,0,0,0.05)'}},
          y2:{position:'right',ticks:{font:{size:10},callback:v=>v+'%'},grid:{display:false}},
          x:{ticks:{font:{size:10}},grid:{display:false}}
        }}
    });
  }
}

// ── 動作 ──
function renderExercises() {
  document.getElementById('muscle-chips').innerHTML=CATS.map(m=>
    `<button class="chip${m===activeMuscleFilter?' on':''}" onclick="setMuscleFilter('${m}')">${m}</button>`
  ).join('');
  filterEx();
}
function setMuscleFilter(m) {
  activeMuscleFilter=m;
  document.querySelectorAll('#muscle-chips .chip').forEach(c=>{c.className='chip'+(c.textContent===m?' on':'');});
  filterEx();
}
function filterEx() {
  const q=(document.getElementById('ex-search').value||'').toLowerCase();
  const exMap={};
  const setMap={};
  workoutRows.forEach(r=>{
    const name=r.exercise_name||''; if(!name) return;
    if(!exMap[name]) exMap[name]={name,muscle:r.muscle_groups||'',cat:classifyMuscle(r.muscle_groups),latestDate:'',latestWeight:0,latestReps:0,latestSec:0,bestWeight:0};
    const e=exMap[name];
    const w=parseFloat(r.weight_kg||0), rp=parseInt(r.reps||0), sec=parseInt(r.duration_sec||0);
    if(r.date>e.latestDate){e.latestDate=r.date;e.latestWeight=w;e.latestReps=rp;e.latestSec=sec;}
    if(w>e.bestWeight) e.bestWeight=w;
    const k=r.date+'|'+name;
    setMap[k]=(setMap[k]||0)+1;
  });
  let arr=Object.values(exMap);
  if(activeMuscleFilter!=='全部') arr=arr.filter(e=>e.cat===activeMuscleFilter);
  if(q) arr=arr.filter(e=>e.name.toLowerCase().includes(q));
  arr.sort((a,b)=>b.latestDate.localeCompare(a.latestDate));
  document.getElementById('ex-table').innerHTML=arr.length?arr.map(e=>{
    const setsNum=setMap[e.latestDate+'|'+e.name]||1;
    let top,bot='';
    if(e.latestSec>0&&e.latestWeight===0){
      top=e.latestSec+'秒 × '+setsNum+'組';
    } else {
      const w=e.latestWeight>0?e.latestWeight+' kg':'自重';
      const bw=e.bestWeight>0?e.bestWeight+' kg':'自重';
      top=w+' × '+setsNum+'組';
      bot=`<div class="ex-best ${e.latestWeight>=e.bestWeight?'hi':''}">最佳 ${bw}</div>`;
    }
    return `<div class="ex-row"><div><div class="ex-name">${e.name}</div><div class="ex-meta">${e.latestDate}</div></div><div class="ex-right"><div class="ex-cur">${top}</div>${bot}</div></div>`;
  }).join(''):'<div class="empty">沒有符合的動作</div>';
}

// ── 日誌 ──
function renderLog() {
  document.getElementById('log-chips').innerHTML=CATS.map(m=>
    `<button class="chip${m===activeLogFilter?' on':''}" onclick="setLogFilter('${m}')">${m}</button>`
  ).join('');
  renderLogList();
}
function setLogFilter(m) {
  activeLogFilter=m;
  document.querySelectorAll('#log-chips .chip').forEach(c=>{c.className='chip'+(c.textContent===m?' on':'');});
  renderLogList();
}
function renderLogList() {
  let rows=workoutRows;
  if(activeLogFilter!=='全部') rows=rows.filter(r=>classifyMuscle(r.muscle_groups)===activeLogFilter);
  const weekMap={};
  rows.forEach(r=>{
    if(!r.date) return;
    const dt=new Date(r.date), day=dt.getDay()||7;
    const mon=new Date(dt); mon.setDate(dt.getDate()-day+1);
    const wk=mon.toISOString().slice(0,10);
    if(!weekMap[wk]) weekMap[wk]={mon,rows:[]};
    weekMap[wk].rows.push(r);
  });
  const weeks=Object.keys(weekMap).sort().reverse();
  if(!weeks.length){document.getElementById('log-list').innerHTML='<div class="empty">尚無訓練紀錄</div>';return;}
  document.getElementById('log-list').innerHTML=weeks.map(wk=>{
    const {mon,rows}=weekMap[wk];
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    const dayCount=new Set(rows.map(r=>r.date)).size;
    const totalVol=rows.reduce((s,r)=>s+(parseFloat(r.weight_kg||0)*parseInt(r.reps||0)),0);
    const label=(mon.getMonth()+1)+'/'+mon.getDate()+' – '+(sun.getMonth()+1)+'/'+sun.getDate();
    const dayMap={};
    rows.forEach(r=>{if(!dayMap[r.date])dayMap[r.date]=[];dayMap[r.date].push(r);});
    const items=Object.keys(dayMap).sort().reverse().map(date=>{
      const exMap2={};
      dayMap[date].forEach(r=>{
        const k=r.exercise_name||'';
        if(!exMap2[k]) exMap2[k]={name:k,muscle:r.muscle_groups||'',sets:[],isPR:false,note:''};
        exMap2[k].sets.push(r);
        if((r.is_pr||'').toUpperCase()==='TRUE') exMap2[k].isPR=true;
        if(r.note) exMap2[k].note=r.note;
      });
      return Object.values(exMap2).map(ex=>{
        const setsNum=ex.sets.length;
        const maxW=Math.max(...ex.sets.map(s=>parseFloat(s.weight_kg||0)));
        const maxSec=Math.max(...ex.sets.map(s=>parseInt(s.duration_sec||0)));
        const lastReps=ex.sets[ex.sets.length-1]?.reps||'';
        const detail=maxSec>0&&maxW===0
          ? maxSec+'秒 × '+setsNum+'組'
          : (maxW>0?maxW+' kg':'自重')+' × '+lastReps+'下 × '+setsNum+'組';
        const cat=classifyMuscle(ex.muscle);
        return '<div class="log-item">'+
          '<div class="log-top"><div class="log-name">'+ex.name+'</div><div class="log-date-lbl">'+date.slice(5).replace('-','/')+'</div></div>'+
          '<div class="log-detail">'+detail+'</div>'+
          '<div class="log-chips"><span class="log-chip muscle">'+cat+'</span>'+(ex.isPR?'<span class="log-chip pr">PR</span>':'')+(ex.note?'<span class="log-chip">'+ex.note+'</span>':'')+'</div>'+
        '</div>';
      }).join('');
    }).join('');
    return `<div class="week-block"><div class="week-head"><div class="week-range">${label}</div><div class="week-stat">${dayCount}天 · ${totalVol.toLocaleString()}kg</div></div>${items}</div>`;
  }).join('');
}

// ── InBody ──
function renderInBody() {
  if(!inbodyRows.length){
    document.getElementById('ib-latest').innerHTML='<div class="empty">尚無 InBody 紀錄<br>請傳送 InBody 圖片至 LINE Bot</div>';
    return;
  }
  const sorted=[...inbodyRows].sort((a,b)=>b.date.localeCompare(a.date));
  const lat=sorted[0], prv=sorted[1];
  function delta(cur,p,unit,inv){
    if(!p) return '';
    const d=(parseFloat(cur)-parseFloat(p)).toFixed(1);
    const good=inv?parseFloat(d)<0:parseFloat(d)>0;
    return '<div class="ib-delta '+(good?'up':'dn')+'">'+(parseFloat(d)>0?'↑':'↓')+' '+Math.abs(parseFloat(d)).toFixed(1)+unit+'</div>';
  }
  const fatChg=prv?parseFloat(lat.body_fat_pct)-parseFloat(prv.body_fat_pct):0;
  const mscChg=prv?parseFloat(lat.smm_kg)-parseFloat(prv.smm_kg):0;
  let stText='維持中',stCls='pill-amber';
  if(mscChg>0&&fatChg<0){stText='增肌減脂進行中 🎉';stCls='pill-green';}
  else if(mscChg>0){stText='肌肉增加中';stCls='pill-green';}
  else if(fatChg<0){stText='體脂下降中';stCls='pill-green';}

  // fitness score progress bar
  const score = lat.fitness_score||0;
  const scoreBar = score ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--surface2);">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">'+
      '<span style="font-size:12px;color:var(--text2);">健身評分</span>'+
      '<span style="font-size:14px;font-weight:500;">'+(score)+' 分'+(prv?.fitness_score?'<span style="font-size:11px;color:'+(score>prv.fitness_score?'var(--green)':'var(--red)')+'"> ('+(score>prv.fitness_score?'+':'')+(score-prv.fitness_score)+')</span>':'')+'</span>'+
    '</div>'+
    '<div style="background:var(--surface2);border-radius:4px;height:6px;">'+
      '<div style="background:var(--green);border-radius:4px;height:6px;width:'+Math.min(score,100)+'%;transition:width .5s;"></div>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:3px;">'+
      '<span style="font-size:9px;color:var(--text3);">0</span>'+
      '<span style="font-size:9px;color:var(--text3);">100</span>'+
    '</div>'+
  '</div>' : '';

  document.getElementById('ib-latest').innerHTML=
    '<div style="display:flex;justify-content:space-between;margin-bottom:14px;">'+
      '<div style="font-size:15px;font-weight:500;">最新測量</div>'+
      '<div style="font-size:11px;color:var(--text3);">'+lat.date+'</div>'+
    '</div>'+
    '<div class="ib-grid">'+
      '<div class="ib-item"><div class="ib-label">體重</div><div class="ib-val">'+lat.weight_kg+'<span class="ib-unit"> kg</span></div>'+delta(lat.weight_kg,prv?.weight_kg,' kg',true)+'</div>'+
      '<div class="ib-item"><div class="ib-label">骨骼肌重</div><div class="ib-val">'+lat.smm_kg+'<span class="ib-unit"> kg</span></div>'+delta(lat.smm_kg,prv?.smm_kg,' kg',false)+'</div>'+
      '<div class="ib-item"><div class="ib-label">體脂率</div><div class="ib-val">'+lat.body_fat_pct+'<span class="ib-unit"> %</span></div>'+delta(lat.body_fat_pct,prv?.body_fat_pct,' %',true)+'</div>'+
      '<div class="ib-item"><div class="ib-label">體脂肪量</div><div class="ib-val">'+lat.body_fat_kg+'<span class="ib-unit"> kg</span></div>'+delta(lat.body_fat_kg,prv?.body_fat_kg,' kg',true)+'</div>'+
      '<div class="ib-item"><div class="ib-label">除脂體重</div><div class="ib-val">'+lat.ffm_kg+'<span class="ib-unit"> kg</span></div>'+delta(lat.ffm_kg,prv?.ffm_kg,' kg',false)+'</div>'+
      '<div class="ib-item"><div class="ib-label">BMI</div><div class="ib-val">'+lat.bmi+'</div></div>'+
      '<div class="ib-item"><div class="ib-label">基礎代謝</div><div class="ib-val">'+lat.bmr_kcal+'<span class="ib-unit"> kcal</span></div>'+delta(lat.bmr_kcal,prv?.bmr_kcal,' kcal',false)+'</div>'+
      '<div class="ib-item"><div class="ib-label">內臟脂肪等級</div><div class="ib-val">'+lat.visceral_fat+'<span class="ib-unit"> 級</span></div>'+delta(lat.visceral_fat,prv?.visceral_fat,' 級',true)+'</div>'+
    '</div>'+
    '<span class="status-pill '+stCls+'">'+stText+'</span>'+
    scoreBar;

  // Chart 1: 體重 & 骨骼肌 (kg scale)
  const cd=sorted.slice(0,6).reverse();
  const labels=cd.map(r=>r.date.slice(5).replace('-','/'));
  if(ibChart) ibChart.destroy();
  ibChart=new Chart(document.getElementById('ib-chart'),{type:'line',data:{
    labels,
    datasets:[
      {label:'體重',data:cd.map(r=>r.weight_kg||null),borderColor:'#185fa5',backgroundColor:'rgba(24,95,165,0.1)',borderWidth:2,pointRadius:4,fill:true,tension:0.35},
      {label:'骨骼肌',data:cd.map(r=>r.smm_kg||null),borderColor:'#3b6d11',backgroundColor:'rgba(59,109,17,0.1)',borderWidth:2,pointRadius:4,fill:true,tension:0.35},
      {label:'體脂肪量',data:cd.map(r=>r.body_fat_kg||null),borderColor:'#993c1d',backgroundColor:'rgba(153,60,29,0.08)',borderWidth:2,pointRadius:4,fill:true,tension:0.35},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{
        y:{ticks:{font:{size:10},callback:v=>v+'kg'},grid:{color:'rgba(0,0,0,0.05)'}},
        x:{ticks:{font:{size:10}},grid:{display:false}}
      }}
  });

  // Chart 2: 體脂率 (separate)
  const c2el=document.getElementById('ib-chart2');
  if(c2el){
    if(window.ibChart2) window.ibChart2.destroy();
    window.ibChart2=new Chart(c2el,{type:'line',data:{
      labels,
      datasets:[{
        label:'體脂率',data:cd.map(r=>r.body_fat_pct||null),
        borderColor:'#993c1d',backgroundColor:'rgba(153,60,29,0.08)',
        borderWidth:2,pointRadius:4,fill:true,tension:0.35
      }]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{
          y:{ticks:{font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(0,0,0,0.05)'},min:30,max:50},
          x:{ticks:{font:{size:10}},grid:{display:false}}
        }}
    });
  }
}
</script>
